<svg width="1200" height="70" viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="15%" stop-color="#4F9DFF"/>
      <stop offset="50%" stop-color="#66E3FF"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0%,100% { transform: translateX(-40px); opacity:.6; } 50% { transform: translateX(40px); opacity:1; } }
    </style>
  </defs>
  <rect width="1200" height="70" fill="#0D1117"/>
  <line x1="0" y1="35" x2="1200" y2="35" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.55"/>
  <circle class="sweep" cx="600" cy="35" r="3" fill="#66E3FF"/>
</svg>
