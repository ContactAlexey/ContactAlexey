<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .edge { stroke: #4F9DFF; stroke-opacity: 0.18; stroke-width: 1; }
      .edge-active { stroke: #66E3FF; stroke-opacity: 0; animation: flow 3.5s ease-in-out infinite; }
      @keyframes flow { 0%,100% { stroke-opacity: 0; } 50% { stroke-opacity: .6; } }
      .neuron { fill: #0D1117; stroke-width: 1.6; }
      .n-in { stroke: #4F9DFF; }
      .n-hid { stroke: #A855F7; }
      .n-out { stroke: #66E3FF; }
      .glow-pulse { animation: glowp 2.4s ease-in-out infinite; }
      @keyframes glowp { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8B949E; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="320" fill="#0D1117"/>

  <!-- layer positions: input x=150, hidden1 x=380, hidden2 x=560, output x=760 -->
  <g class="edge">
    <!-- input -> hidden1 -->
    <path d="M150,60 L380,50"/><path d="M150,60 L380,120"/><path d="M150,60 L380,190"/><path d="M150,60 L380,260"/>
    <path d="M150,140 L380,50"/><path d="M150,140 L380,120"/><path d="M150,140 L380,190"/><path d="M150,140 L380,260"/>
    <path d="M150,220 L380,50"/><path d="M150,220 L380,120"/><path d="M150,220 L380,190"/><path d="M150,220 L380,260"/>
    <path d="M150,280 L380,50"/><path d="M150,280 L380,120"/><path d="M150,280 L380,190"/><path d="M150,280 L380,260"/>
    <!-- hidden1 -> hidden2 -->
    <path d="M380,50 L560,90"/><path d="M380,50 L560,230"/>
    <path d="M380,120 L560,90"/><path d="M380,120 L560,230"/>
    <path d="M380,190 L560,90"/><path d="M380,190 L560,230"/>
    <path d="M380,260 L560,90"/><path d="M380,260 L560,230"/>
    <!-- hidden2 -> output -->
    <path d="M560,90 L760,160"/><path d="M560,230 L760,160"/>
  </g>

  <g class="edge-active" style="animation-delay:0s"><path d="M150,60 L380,120"/></g>
  <g class="edge-active" style="animation-delay:.5s"><path d="M150,220 L380,190"/></g>
  <g class="edge-active" style="animation-delay:1s"><path d="M380,120 L560,90"/></g>
  <g class="edge-active" style="animation-delay:1.5s"><path d="M380,260 L560,230"/></g>
  <g class="edge-active" style="animation-delay:2s"><path d="M560,90 L760,160"/></g>
  <g class="edge-active" style="animation-delay:2.5s"><path d="M560,230 L760,160"/></g>

  <!-- input neurons -->
  <g class="neuron n-in">
    <circle class="glow-pulse" cx="150" cy="60" r="9" style="animation-delay:0s"/>
    <circle class="glow-pulse" cx="150" cy="140" r="9" style="animation-delay:.3s"/>
    <circle class="glow-pulse" cx="150" cy="220" r="9" style="animation-delay:.6s"/>
    <circle class="glow-pulse" cx="150" cy="280" r="9" style="animation-delay:.9s"/>
  </g>
  <!-- hidden layer 1 -->
  <g class="neuron n-hid">
    <circle class="glow-pulse" cx="380" cy="50" r="9" style="animation-delay:.2s"/>
    <circle class="glow-pulse" cx="380" cy="120" r="9" style="animation-delay:.5s"/>
    <circle class="glow-pulse" cx="380" cy="190" r="9" style="animation-delay:.8s"/>
    <circle class="glow-pulse" cx="380" cy="260" r="9" style="animation-delay:1.1s"/>
  </g>
  <!-- hidden layer 2 -->
  <g class="neuron n-hid">
    <circle class="glow-pulse" cx="560" cy="90" r="9" style="animation-delay:.4s"/>
    <circle class="glow-pulse" cx="560" cy="230" r="9" style="animation-delay:.7s"/>
  </g>
  <!-- output -->
  <g class="neuron n-out">
    <circle class="glow-pulse" cx="760" cy="160" r="11" style="animation-delay:.1s"/>
  </g>

  <text x="150" y="310" class="label">INPUT</text>
  <text x="470" y="310" class="label">HIDDEN LAYERS</text>
  <text x="760" y="310" class="label">THREAT SCORE</text>
</svg>
